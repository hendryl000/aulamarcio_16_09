<form method="get">
    <input
        type="text"
        name="nome"
        placeholder="Pesquisar por nome"
        value="{{ filtros.nome }}"
    >

    <select name="tipo">
        <option value="">Todos os tipos</option>

        {% for valor, descricao in tipos_acervo %}
            <option value="{{ valor }}"
                {% if filtros.tipo == valor %}selected{% endif %}
            >
                {{ descricao }}
            </option>
        {% endfor %}
    </select>

    <select name="categoria">
        <option value="">Todas as categorias</option>

        {% for valor, descricao in categorias %}
            <option value="{{ valor }}"
                {% if filtros.categoria == valor %}selected{% endif %}
            >
                {{ descricao }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Pesquisar</button>
</form>
