{% extends "base.html" %}

{% block conteudo %}
<h1>Acervo</h1>
  <input
        type="text"
        name="nome"
        placeholder="Pesquisar por nome"
        value="{{ filtros.nome }}"
    >
<ul>
    {% for livro in livros %}
        <li>
            {{ livro.titulo }} — {{ livro.autor }} — {{ livro.ano }}
        </li>
    {% empty %}
        <li>Nenhum livro cadastrado.</li>
    {% endfor %}
</ul>
{% endblock %}
